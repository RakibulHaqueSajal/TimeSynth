# Source: slurm/run_transformer.sh, transformers_new.sh (27 training blocks); checkpoint names confirm wd=1e-4, lr=1e-4
# The runner feeds the first half of the history to the encoder and the second half as decoder warm-up.
model: Autoformer
label: Autoformer
args:
  learning_rate: 0.0001
  weight_decay: 0.0001
  train_epochs: 300
  patience: 30
  e_layers: 2
  d_layers: 1
  n_heads: 8
  d_model: 256
  d_ff: 256
  moving_avg: 25
  dropout: 0.2
  fc_dropout: 0.2
  head_dropout: 0.2
  pct_start: 0.2
  revin: 1
  decomposition: 0
  dec_in: 1
  c_out: 1
  backcast: 0
  batch_size: 128
  lradj: TST

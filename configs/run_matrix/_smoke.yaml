# Tiny matrix used to validate the launcher on the cluster (2 epochs).
phase: smoke
results_dir: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/Time_Series/TimeSynth_runs/smoke/results
checkpoint_dir: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/Time_Series/TimeSynth_runs/smoke/checkpoints
slurm: {partition: general-gpu, account: medvic, time: "0-00:20:00", mem: 16G, cpus: 4, gres: "gpu:1", max_concurrent: 4}
env:
  conda_python: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/miniconda3/envs/timeenv/bin/python
extra_args: "--num_workers 4 --train_epochs 2 --patience 1"
blocks:
  - paradigm: clean
    signals: [Drift_Harmonic]
    models: [Linear, PatchTST]
    seeds: [2021]
    is_training: 1

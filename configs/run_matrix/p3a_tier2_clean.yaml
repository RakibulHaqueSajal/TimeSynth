phase: p3a_tier2_clean
results_dir: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/Time_Series/TimeSynth_runs/revision/results
checkpoint_dir: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/Time_Series/TimeSynth_runs/revision/checkpoints
slurm:
  partition: general-gpu
  time: 1-00:00:00
  mem: 48G
  cpus: 6
  gres: gpu:1
  max_concurrent: 5
env:
  conda_python: /uufs/sci.utah.edu/projects/medvic-lab/Rakib/miniconda3/envs/timeenv/bin/python
extra_args: --num_workers 4
blocks:
- paradigm: tier2_ecg
  models: &id001
  - Linear
  - DLinear
  - FITS
  - MLinear
  - NBeats
  - FreMLP
  - MICN_Mean
  - MICN_Regre
  - ModernTCN
  - PatchTST
  - Transformer
  - Autoformer
  - TSMixer
  - SeasonalNaive
  seeds: &id002
  - 2021
  - 2022
  - 2023
  is_training: 1
- paradigm: tier2_ppg
  models: *id001
  seeds: *id002
  is_training: 1
- paradigm: tier2_eeg
  models: *id001
  seeds: *id002
  is_training: 1
- paradigm: tier2_ecg
  models:
  - TimesNet
  seeds: *id002
  is_training: 1
  extra_args: --train_epochs 60 --patience 10
- paradigm: tier2_ppg
  models:
  - TimesNet
  seeds: *id002
  is_training: 1
  extra_args: --train_epochs 60 --patience 10
- paradigm: tier2_eeg
  models:
  - TimesNet
  seeds: *id002
  is_training: 1
  extra_args: --train_epochs 60 --patience 10

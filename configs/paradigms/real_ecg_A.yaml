# Real data, ecg, Track A (P1.2). Signals are datasets; root = $TIMESYNTH_REAL/processed/<dataset>_A.
# Test windows: stride seq_len+pred_len (non-overlapping) and at most 200 per chunk file (P1.3).
name: real_ecg_A
fs: 10.0
data_root: ${TIMESYNTH_REAL}/processed
data_root_rel: ""
signals:
  NSRDB: nsrdb_A
  AFDB: afdb_A
args:
  data: custom
  task_name: long_term_forecast
  features: S
  target: Value
  enc_in: 1
  seq_len: 50
  label_len: 0
  pred_len: 100
  train_stride: 10
  eval_stride: 150
  test_drop_last: false
  max_windows_per_file: 200

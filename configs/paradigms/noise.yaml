# Noise robustness (Fig. 4): test-only evaluation of the clean checkpoints at six SNR levels.
# Use with --condition SNR_k and --checkpoint_name pointing at the clean run.
name: noise
fs: 10.0
data_root_rel: Noise
signals:
  Drift_Harmonic: Drift_Harmonic_Test
  Single_Phase_Modulation: PhaseMod_SingleFreq
  Dual_Phase_Modulation: PhaseMod_TwoFreq
args:
  data: custom
  task_name: long_term_forecast
  features: S
  target: Value
  enc_in: 1
  seq_len: 50
  label_len: 0
  pred_len: 100
  test_sample_size: 20
  eval_stride: 150
  test_drop_last: false
conditions:
  SNR_1: "{signal}/SNR_1"
  SNR_2: "{signal}/SNR_2"
  SNR_3: "{signal}/SNR_3"
  SNR_4: "{signal}/SNR_4"
  SNR_5: "{signal}/SNR_5"
  SNR_6: "{signal}/SNR_6"

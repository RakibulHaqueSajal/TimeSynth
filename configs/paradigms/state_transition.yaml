# Single deterministic state transition (Figs. 6-7). Revision protocol: uniform stride-1 training
# windows (Dataset_Custom) and non-overlapping test windows; the H/F tags of Fig. 7 are assigned in
# analysis from meta.parquet (file_name, window_start) and the generator's test_transitions.csv,
# instead of the legacy tag-aware loaders. 600/100/200 signals as in the paper (Table: dataset sizes).
name: state_transition
fs: 10.0
data_root_rel: ""
signals:
  Single_Phase_Modulation: PhaseMod_OneState_Change
args:
  data: custom
  task_name: long_term_forecast
  features: S
  target: Value
  enc_in: 1
  seq_len: 50
  label_len: 0
  pred_len: 100
  train_sample_size: 600
  val_sample_size: 100
  test_sample_size: 200
  train_stride: 1
  eval_stride: 150
  test_drop_last: false

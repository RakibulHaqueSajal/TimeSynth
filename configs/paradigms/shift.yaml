# Frequency distribution shift (Fig. 5): test-only evaluation of the clean checkpoints on
# five frequency buckets per family (test split only exists). Bucket 0 is the in-distribution band.
name: shift
fs: 10.0
data_root_rel: Distribution_Shift
signals:
  Drift_Harmonic: Drift_Harmonic
  Single_Phase_Modulation: Phasemod_SingleFreq
  Dual_Phase_Modulation: Phasemod_TwoFreq
args:
  data: custom
  task_name: long_term_forecast
  features: S
  target: Value
  enc_in: 1
  seq_len: 50
  label_len: 0
  pred_len: 100
  test_sample_size: 20
  eval_stride: 150
  test_drop_last: false
conditions:
  bucket_0:
    Drift_Harmonic: Drift_Harmonic/f_0.85_1.10
    Single_Phase_Modulation: Phasemod_SingleFreq/f_0.680_1.410
    Dual_Phase_Modulation: Phasemod_TwoFreq/f0_0.68_1.41__f1_0.68_1.41
  bucket_m2:
    Drift_Harmonic: Drift_Harmonic/f_0.35_0.60

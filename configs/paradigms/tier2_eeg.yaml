# Tier 2 transient-rich EEG (Phase 3, D5; EEG at 100 Hz for 20 ms spikes). Same 5 s history / 10 s horizon in seconds.
# Train stride > 1 keeps the window list in memory; test windows are non-overlapping. Noise conditions
# are test-only evaluations of the clean checkpoint on the per-SNR noisy test copies.
name: tier2_eeg
fs: 100.0
data_root_rel: Tier2_EEG
signals:
  EEG: ""
args:
  data: custom
  task_name: long_term_forecast
  features: S
  target: Value
  enc_in: 1
  seq_len: 500
  label_len: 0
  pred_len: 1000
  train_stride: 20
  eval_stride: 1500
  test_drop_last: false
  batch_size: 32
conditions:
  SNR_1: noise_SNR_1
  SNR_2: noise_SNR_2
  SNR_3: noise_SNR_3
  SNR_4: noise_SNR_4
  SNR_5: noise_SNR_5
  SNR_6: noise_SNR_6
